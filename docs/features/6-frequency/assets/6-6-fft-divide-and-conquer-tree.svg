<svg xmlns="http://www.w3.org/2000/svg" width="2800" height="2400" viewBox="0 0 700 600" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="700" height="600" fill="#ffffff"/>

  <text x="20" y="28" font-size="17" font-weight="bold" fill="#111827">fft_1d(signal) の再帰呼び出しの木構造（N=8の例）</text>
  <text x="20" y="46" font-size="12" fill="#6b7280">signal=[10,11,12,13,14,15,16,17]。各箱は「どのインデックスを担当しているか」を示す</text>

  <!-- 接続線（親→子）: Level0 -> Level1 -->
  <line x1="340" y1="116" x2="180" y2="224" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="340" y1="116" x2="500" y2="224" stroke="#9ca3af" stroke-width="1.5"/>

  <!-- Level1 -> Level2 -->
  <line x1="180" y1="256" x2="100" y2="364" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="180" y1="256" x2="260" y2="364" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="500" y1="256" x2="420" y2="364" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="500" y1="256" x2="580" y2="364" stroke="#9ca3af" stroke-width="1.5"/>

  <!-- Level2 -> Level3(leaves) -->
  <line x1="100" y1="396" x2="60"  y2="504" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="100" y1="396" x2="140" y2="504" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="260" y1="396" x2="220" y2="504" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="260" y1="396" x2="300" y2="504" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="420" y1="396" x2="380" y2="504" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="420" y1="396" x2="460" y2="504" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="580" y1="396" x2="540" y2="504" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="580" y1="396" x2="620" y2="504" stroke="#9ca3af" stroke-width="1.5"/>

  <!-- Level0: N=8 -->
  <rect x="230" y="84" width="220" height="32" rx="4" fill="#2563eb" stroke="#1e40af" stroke-width="1"/>
  <text x="340" y="105" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">[0,1,2,3,4,5,6,7]  N=8</text>

  <!-- Level1: N=4, 偶数/奇数に分割 -->
  <rect x="110" y="224" width="140" height="32" rx="4" fill="#2563eb" stroke="#1e40af" stroke-width="1"/>
  <text x="180" y="245" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">[0,2,4,6]  N=4</text>
  <rect x="430" y="224" width="140" height="32" rx="4" fill="#ea580c" stroke="#9a3412" stroke-width="1"/>
  <text x="500" y="245" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">[1,3,5,7]  N=4</text>

  <!-- Level2: N=2 -->
  <rect x="65"  y="364" width="70" height="32" rx="4" fill="#2563eb" stroke="#1e40af" stroke-width="1"/>
  <text x="100" y="385" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">[0,4] N=2</text>
  <rect x="225" y="364" width="70" height="32" rx="4" fill="#ea580c" stroke="#9a3412" stroke-width="1"/>
  <text x="260" y="385" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">[2,6] N=2</text>
  <rect x="385" y="364" width="70" height="32" rx="4" fill="#2563eb" stroke="#1e40af" stroke-width="1"/>
  <text x="420" y="385" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">[1,5] N=2</text>
  <rect x="545" y="364" width="70" height="32" rx="4" fill="#ea580c" stroke="#9a3412" stroke-width="1"/>
  <text x="580" y="385" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">[3,7] N=2</text>

  <!-- Level3: N=1 (終了条件、leaves) -->
  <rect x="40"  y="504" width="40" height="30" rx="4" fill="#9ca3af" stroke="#4b5563" stroke-width="1"/>
  <text x="60"  y="524" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">[0]</text>
  <rect x="120" y="504" width="40" height="30" rx="4" fill="#9ca3af" stroke="#4b5563" stroke-width="1"/>
  <text x="140" y="524" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">[4]</text>
  <rect x="200" y="504" width="40" height="30" rx="4" fill="#9ca3af" stroke="#4b5563" stroke-width="1"/>
  <text x="220" y="524" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">[2]</text>
  <rect x="280" y="504" width="40" height="30" rx="4" fill="#9ca3af" stroke="#4b5563" stroke-width="1"/>
  <text x="300" y="524" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">[6]</text>
  <rect x="360" y="504" width="40" height="30" rx="4" fill="#9ca3af" stroke="#4b5563" stroke-width="1"/>
  <text x="380" y="524" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">[1]</text>
  <rect x="440" y="504" width="40" height="30" rx="4" fill="#9ca3af" stroke="#4b5563" stroke-width="1"/>
  <text x="460" y="524" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">[5]</text>
  <rect x="520" y="504" width="40" height="30" rx="4" fill="#9ca3af" stroke="#4b5563" stroke-width="1"/>
  <text x="540" y="524" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">[3]</text>
  <rect x="600" y="504" width="40" height="30" rx="4" fill="#9ca3af" stroke="#4b5563" stroke-width="1"/>
  <text x="620" y="524" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">[7]</text>

  <!-- 右側の凡例・ラベル -->
  <text x="640" y="104" font-size="11" fill="#6b7280">Divide</text>
  <text x="640" y="244" font-size="11" fill="#6b7280">Divide</text>
  <text x="640" y="384" font-size="11" fill="#6b7280">Divide</text>
  <text x="620" y="552" font-size="11" fill="#6b7280" text-anchor="middle">Conquer(終了条件)</text>

  <text x="20" y="570" font-size="12" fill="#374151">青＝偶数番目への分割（signal[0::2]）　オレンジ＝奇数番目への分割（signal[1::2]）　灰＝N=1（再帰の底）</text>
</svg>
