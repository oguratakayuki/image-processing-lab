<svg xmlns="http://www.w3.org/2000/svg" width="2080" height="2880" viewBox="0 0 520 720" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ea580c"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="520" height="720" fill="#ffffff"/>

  <text x="20" y="28" font-size="17" font-weight="bold" fill="#111827">k の物差しと k+N/2 の物差しの関係（N=8, k=1 と k+4=5 を比較）</text>
  <text x="20" y="48" font-size="12" fill="#6b7280">exp(-2πi(k+N/2)n/N) = exp(-2πikn/N)・(-1)^n　－　nが偶数なら同じ点、奇数なら正反対の点になる</text>

  <!-- ===== Panel A: n=2 (even) ===== -->
  <text x="20" y="80" font-size="15" font-weight="bold" fill="#111827">nが偶数のとき（例: n=2）－ 2つの物差しは完全に同じ点</text>
  <text x="20" y="98" font-size="12" fill="#374151">(-1)^2 = +1 なので、ruler(k=1, n=2) と ruler(k=5, n=2) は一致する</text>

  <line x1="90" y1="170" x2="310" y2="170" stroke="#9ca3af" stroke-width="1"/>
  <line x1="190" y1="80" x2="190" y2="280" stroke="#9ca3af" stroke-width="1"/>
  <text x="315" y="174" font-size="11" fill="#6b7280">Re</text>
  <text x="194" y="86" font-size="11" fill="#6b7280">Im</text>
  <circle cx="190" cy="170" r="110" fill="none" stroke="#e5e7eb" stroke-width="1"/>

  <line x1="190.0" y1="170.0" x2="190.0" y2="272.0" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
  <circle cx="190" cy="280" r="6" fill="#2563eb"/>
  <text x="250" y="284" font-size="12" font-weight="bold" fill="#2563eb" text-anchor="middle">ruler(k=1,n=2)</text>
  <text x="250" y="300" font-size="12" font-weight="bold" fill="#2563eb" text-anchor="middle">= ruler(k=5,n=2)</text>
  <text x="250" y="316" font-size="12" font-weight="bold" fill="#2563eb" text-anchor="middle">= 0 - 1.0000j</text>

  <text x="20" y="348" font-size="13" font-weight="bold" fill="#2563eb">→ 偶数番目(n=2)の寄与は、kでもk+4でも全く同じ値になる</text>

  <!-- ===== Panel B: n=1 (odd) ===== -->
  <text x="20" y="390" font-size="15" font-weight="bold" fill="#111827">nが奇数のとき（例: n=1）－ 2つの物差しは正反対の点</text>
  <text x="20" y="408" font-size="12" fill="#374151">(-1)^1 = -1 なので、ruler(k=5, n=1) は ruler(k=1, n=1) のちょうど正反対</text>

  <line x1="60" y1="540" x2="320" y2="540" stroke="#9ca3af" stroke-width="1"/>
  <line x1="190" y1="410" x2="190" y2="670" stroke="#9ca3af" stroke-width="1"/>
  <text x="325" y="544" font-size="11" fill="#6b7280">Re</text>
  <text x="194" y="416" font-size="11" fill="#6b7280">Im</text>
  <circle cx="190" cy="540" r="110" fill="none" stroke="#e5e7eb" stroke-width="1"/>

  <line x1="190.0" y1="540.0" x2="262.1" y2="612.1" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
  <circle cx="267.8" cy="617.8" r="6" fill="#2563eb"/>
  <text x="300" y="645" font-size="12" font-weight="bold" fill="#2563eb">ruler(k=1,n=1)</text>
  <text x="300" y="661" font-size="12" font-weight="bold" fill="#2563eb">=+0.71-0.71j</text>

  <line x1="190.0" y1="540.0" x2="117.9" y2="467.9" stroke="#ea580c" stroke-width="3" marker-end="url(#arrowOrange)"/>
  <circle cx="112.2" cy="462.2" r="6" fill="#ea580c"/>
  <text x="80" y="440" font-size="12" font-weight="bold" fill="#ea580c" text-anchor="middle">ruler(k=5,n=1)</text>
  <text x="80" y="456" font-size="12" font-weight="bold" fill="#ea580c" text-anchor="middle">=-0.71+0.71j</text>

  <text x="20" y="705" font-size="13" font-weight="bold" fill="#ea580c">→ 奇数番目(n=1)の寄与は、kとk+4で符号がちょうど逆になる</text>
</svg>
