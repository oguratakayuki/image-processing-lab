<svg xmlns="http://www.w3.org/2000/svg" width="2240" height="1840" viewBox="0 0 560 460" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="560" height="460" fill="#ffffff"/>

  <text x="20" y="28" font-size="16" font-weight="bold" fill="#111827">N=8個の物差しは、単位円上のちょうど8個の点に対応する</text>
  <text x="20" y="48" font-size="12" fill="#6b7280">exp(-2πikn/N) の n=1 での位置を例に表示。kを8以上に増やしても同じ8点の繰り返し</text>

  <!-- axes -->
  <line x1="80"  y1="210" x2="350" y2="210" stroke="#9ca3af" stroke-width="1"/>
  <line x1="200" y1="80"  x2="200" y2="340" stroke="#9ca3af" stroke-width="1"/>
  <text x="355" y="214" font-size="12" fill="#6b7280">Re</text>
  <text x="204" y="88"  font-size="12" fill="#6b7280">Im</text>

  <!-- unit circle -->
  <circle cx="200" cy="210" r="120" fill="none" stroke="#d1d5db" stroke-width="1.5"/>

  <!-- radial "ものさし" vectors from center to each of the 8 points -->
  <line x1="200" y1="210" x2="320.0" y2="210.0" stroke="#93c5fd" stroke-width="1.5"/>
  <line x1="200" y1="210" x2="284.9" y2="294.9" stroke="#93c5fd" stroke-width="1.5"/>
  <line x1="200" y1="210" x2="200.0" y2="330.0" stroke="#93c5fd" stroke-width="1.5"/>
  <line x1="200" y1="210" x2="115.1" y2="294.9" stroke="#93c5fd" stroke-width="1.5"/>
  <line x1="200" y1="210" x2="80.0"  y2="210.0" stroke="#93c5fd" stroke-width="1.5"/>
  <line x1="200" y1="210" x2="115.1" y2="125.1" stroke="#93c5fd" stroke-width="1.5"/>
  <line x1="200" y1="210" x2="200.0" y2="90.0"  stroke="#93c5fd" stroke-width="1.5"/>
  <line x1="200" y1="210" x2="284.9" y2="125.1" stroke="#93c5fd" stroke-width="1.5"/>

  <!-- 8 points -->
  <circle cx="320.0" cy="210.0" r="5" fill="#2563eb"/>
  <circle cx="284.9" cy="294.9" r="5" fill="#2563eb"/>
  <circle cx="200.0" cy="330.0" r="5" fill="#2563eb"/>
  <circle cx="115.1" cy="294.9" r="5" fill="#2563eb"/>
  <circle cx="80.0"  cy="210.0" r="5" fill="#2563eb"/>
  <circle cx="115.1" cy="125.1" r="5" fill="#2563eb"/>
  <circle cx="200.0" cy="90.0"  r="5" fill="#2563eb"/>
  <circle cx="284.9" cy="125.1" r="5" fill="#2563eb"/>

  <!-- labels (placed just outside each point) -->
  <text x="330" y="230" font-size="13" font-weight="bold" fill="#2563eb">k=0</text>
  <text x="300" y="316" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">k=1</text>
  <text x="200" y="352" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">k=2</text>
  <text x="100" y="316" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">k=3</text>
  <text x="58"  y="214" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="end">k=4</text>
  <text x="100" y="112" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">k=5</text>
  <text x="200" y="76"  font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">k=6</text>
  <text x="300" y="112" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">k=7</text>

  <!-- note that k=8 lands back on k=0 -->
  <circle cx="320.0" cy="210.0" r="11" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3,2"/>

  <text x="20" y="384" font-size="13" fill="#dc2626">赤い点線の輪：k=8, k=16, k=24, ... も</text>
  <text x="20" y="402" font-size="13" fill="#dc2626">すべてこの同じ点（k=0の位置）に重なる</text>

  <text x="20" y="426" font-size="13" fill="#374151">→ 単位円を1周するのにちょうど8ステップかかるため、</text>
  <text x="20" y="444" font-size="13" fill="#374151">区別できる物差しは8個しか存在しない（N個ならN個）</text>
</svg>
