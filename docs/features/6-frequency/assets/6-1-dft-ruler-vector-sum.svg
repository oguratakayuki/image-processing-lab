<svg xmlns="http://www.w3.org/2000/svg" width="2800" height="2640" viewBox="0 0 700 660" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="700" height="660" fill="#ffffff"/>

  <text x="20" y="28" font-size="18" font-weight="bold" fill="#111827">物差し（基準波）が信号を測る様子（複素平面でのベクトル合成）</text>
  <text x="20" y="46" font-size="12" fill="#6b7280">信号 x_n = cos(2π・1・n/8) + 0.3・cos(2π・2・n/8)（周波数1が主成分、周波数2が少し混ざっている）</text>

  <!-- ===== Panel 1: k=1（主成分と一致する物差し） ===== -->
  <text x="20" y="74" font-size="15" font-weight="bold" fill="#111827">k=1（信号の主成分と一致する物差し）</text>
  <text x="20" y="92" font-size="12" fill="#374151">各項 x_n・exp(-2πi・1・n/8) を矢印でつなぎ、合計がどこに着地するか見る</text>

  <!-- axes -->
  <line x1="75" y1="170" x2="375" y2="170" stroke="#9ca3af" stroke-width="1"/>
  <line x1="150" y1="95" x2="150" y2="245" stroke="#9ca3af" stroke-width="1"/>
  <text x="380" y="174" font-size="11" fill="#6b7280">Re</text>
  <text x="153" y="100" font-size="11" fill="#6b7280">Im</text>
  <text x="150" y="190" font-size="10" fill="#9ca3af" text-anchor="middle">0</text>
  <text x="200" y="190" font-size="10" fill="#9ca3af" text-anchor="middle">1</text>
  <text x="250" y="190" font-size="10" fill="#9ca3af" text-anchor="middle">2</text>
  <text x="300" y="190" font-size="10" fill="#9ca3af" text-anchor="middle">3</text>
  <text x="350" y="190" font-size="10" fill="#9ca3af" text-anchor="middle">4</text>

  <!-- path (8 segments, verified pixel coordinates, 4px pullback before each vertex) -->
  <line x1="150" y1="170" x2="211.0" y2="170.0" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="215" y1="170" x2="237.2" y2="192.2" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="240" y1="195" x2="240.0" y2="184.0" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="240" y1="180" x2="262.2" y2="157.8" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="265" y1="155" x2="296.0" y2="155.0" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="300" y1="155" x2="322.2" y2="177.2" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="325" y1="180" x2="325.0" y2="191.0" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="325" y1="195" x2="347.2" y2="172.8" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="180" y="158" font-size="11" fill="#2563eb" text-anchor="middle">n=0</text>
  <text x="150" y="150" font-size="11" fill="#374151" text-anchor="middle">出発点(原点)</text>

  <circle cx="350" cy="170" r="5" fill="#2563eb"/>
  <text x="358" y="167" font-size="13" font-weight="bold" fill="#2563eb">X_1 = 4.0</text>

  <text x="20" y="225" font-size="13" font-weight="bold" fill="#2563eb">→ 結論：8項の合計が(4.0, 0)まで進む → X_1 = 4.0（主成分なので大きく積み上がる）</text>

  <!-- ===== Panel 2: k=2（信号に少し含まれる物差し） ===== -->
  <text x="20" y="396" font-size="15" font-weight="bold" fill="#111827">k=2（信号に少しだけ含まれる物差し）</text>
  <text x="20" y="414" font-size="12" fill="#374151">同じ信号を、周波数2の物差し exp(-2πi・2・n/8) で測るとどうなるか</text>

  <line x1="75" y1="510" x2="375" y2="510" stroke="#9ca3af" stroke-width="1"/>
  <line x1="150" y1="435" x2="150" y2="615" stroke="#9ca3af" stroke-width="1"/>
  <text x="380" y="514" font-size="11" fill="#6b7280">Re</text>
  <text x="153" y="440" font-size="11" fill="#6b7280">Im</text>
  <text x="150" y="530" font-size="10" fill="#9ca3af" text-anchor="middle">0</text>
  <text x="200" y="530" font-size="10" fill="#9ca3af" text-anchor="middle">1</text>

  <!-- path (8 segments) -->
  <line x1="150" y1="510" x2="211.0" y2="510.0" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowGray)"/>
  <line x1="215" y1="510" x2="215.0" y2="541.4" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowGray)"/>
  <line x1="215" y1="545.4" x2="226.0" y2="545.4" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowGray)"/>
  <line x1="230" y1="545.4" x2="230.0" y2="576.7" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowGray)"/>
  <line x1="230" y1="580.7" x2="199.0" y2="580.7" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowGray)"/>
  <line x1="195" y1="580.7" x2="195.0" y2="549.4" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowGray)"/>
  <line x1="195" y1="545.4" x2="206.0" y2="545.4" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowGray)"/>
  <line x1="210" y1="545.4" x2="210.0" y2="514.0" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowGray)"/>

  <text x="150" y="498" font-size="11" fill="#374151" text-anchor="middle">出発点(原点)</text>
  <text x="182" y="524" font-size="11" fill="#6b7280" text-anchor="middle">n=0</text>

  <circle cx="210" cy="510" r="5" fill="#6b7280"/>
  <text x="218" y="500" font-size="13" font-weight="bold" fill="#6b7280">X_2 = 1.2</text>

  <text x="20" y="605" font-size="13" font-weight="bold" fill="#6b7280">→ 結論：8項の合計は(1.2, 0)までしか進まない → X_2 = 1.2（少し含まれる成分なので小さめ）</text>
  <text x="20" y="623" font-size="11" fill="#6b7280">（X_1=4.0 &gt; X_2=1.2 &gt; 0：「含まれる度合い」に応じて段階的な値になる。0になるとは限らない）</text>
</svg>
