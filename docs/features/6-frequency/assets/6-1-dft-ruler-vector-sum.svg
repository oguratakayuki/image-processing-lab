<svg xmlns="http://www.w3.org/2000/svg" width="2880" height="2920" viewBox="0 0 720 730" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="720" height="730" fill="#ffffff"/>

  <text x="20" y="28" font-size="18" font-weight="bold" fill="#111827">物差し（基準波）が信号を測る様子（複素平面でのベクトル合成）</text>
  <text x="20" y="46" font-size="12" fill="#6b7280">信号 x_n = cos(2π・1・n/8) + 0.3・cos(2π・2・n/8)（周波数1が主成分、周波数2が少し混ざっている）。k=0のみ、比較のため信号が変化しない場合(x_n=1)を使う</text>

  <!-- ===== Panel 0: k=0（信号が全く変わらない場合） ===== -->
  <text x="20" y="74" font-size="15" font-weight="bold" fill="#111827">k=0（信号が全く変わらない場合、物差しも回転しない）</text>
  <text x="20" y="92" font-size="12" fill="#374151">信号 x_n=1（全てのnで同じ値）、物差し exp(-2πi・0・n/8)=1（常に実軸の正方向を向く）</text>

  <line x1="75" y1="160" x2="460" y2="160" stroke="#9ca3af" stroke-width="1"/>
  <line x1="150" y1="130" x2="150" y2="190" stroke="#9ca3af" stroke-width="1"/>
  <text x="465" y="164" font-size="11" fill="#6b7280">Re</text>
  <text x="153" y="136" font-size="11" fill="#6b7280">Im</text>

  <line x1="150.0" y1="160.0" x2="174.0" y2="160.0" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="178.0" y1="160.0" x2="202.0" y2="160.0" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="206.0" y1="160.0" x2="230.0" y2="160.0" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="234.0" y1="160.0" x2="258.0" y2="160.0" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="262.0" y1="160.0" x2="286.0" y2="160.0" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="290.0" y1="160.0" x2="314.0" y2="160.0" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="318.0" y1="160.0" x2="342.0" y2="160.0" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="346.0" y1="160.0" x2="370.0" y2="160.0" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="150" y="118" font-size="11" fill="#374151" text-anchor="middle">出発点(原点)</text>
  <text x="178" y="148" font-size="11" fill="#2563eb" text-anchor="middle">n=0</text>
  <circle cx="374" cy="160" r="5" fill="#2563eb"/>
  <text x="382" y="157" font-size="13" font-weight="bold" fill="#2563eb">X_0 = 8.0</text>

  <text x="20" y="215" font-size="13" font-weight="bold" fill="#2563eb">→ 結論：信号が変わらないため、物差しも回転せず全ベクトルが同じ方向を向く</text>
  <text x="20" y="233" font-size="13" font-weight="bold" fill="#2563eb">→ 一直線に積み上がりX_0=8.0（最大値）。k=1以降は全て0、値はk=0に集中する</text>

  <!-- ===== Panel 1: k=1（主成分と一致する物差し） ===== -->
  <text x="20" y="274" font-size="15" font-weight="bold" fill="#111827">k=1（信号の主成分と一致する物差し）</text>
  <text x="20" y="292" font-size="12" fill="#374151">各項 x_n・exp(-2πi・1・n/8) を矢印でつなぎ、合計がどこに着地するか見る</text>

  <!-- axes -->
  <line x1="75" y1="370" x2="440" y2="370" stroke="#9ca3af" stroke-width="1"/>
  <line x1="150" y1="295" x2="150" y2="445" stroke="#9ca3af" stroke-width="1"/>
  <text x="445" y="374" font-size="11" fill="#6b7280">Re</text>
  <text x="153" y="300" font-size="11" fill="#6b7280">Im</text>
  <text x="150" y="390" font-size="10" fill="#9ca3af" text-anchor="middle">0</text>
  <text x="200" y="390" font-size="10" fill="#9ca3af" text-anchor="middle">1</text>
  <text x="250" y="390" font-size="10" fill="#9ca3af" text-anchor="middle">2</text>
  <text x="300" y="390" font-size="10" fill="#9ca3af" text-anchor="middle">3</text>
  <text x="350" y="390" font-size="10" fill="#9ca3af" text-anchor="middle">4</text>

  <!-- path (8 segments, verified pixel coordinates, 4px pullback before each vertex) -->
  <line x1="150" y1="370" x2="211.0" y2="370.0" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="215" y1="370" x2="237.2" y2="392.2" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="240" y1="395" x2="240.0" y2="384.0" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="240" y1="380" x2="262.2" y2="357.8" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="265" y1="355" x2="296.0" y2="355.0" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="300" y1="355" x2="322.2" y2="377.2" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="325" y1="380" x2="325.0" y2="391.0" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="325" y1="395" x2="347.2" y2="372.8" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="180" y="358" font-size="11" fill="#2563eb" text-anchor="middle">n=0</text>
  <text x="150" y="350" font-size="11" fill="#374151" text-anchor="middle">出発点(原点)</text>

  <circle cx="350" cy="370" r="5" fill="#2563eb"/>
  <text x="358" y="367" font-size="13" font-weight="bold" fill="#2563eb">X_1 = 4.0</text>

  <text x="20" y="425" font-size="13" font-weight="bold" fill="#2563eb">→ 結論：8項の合計が(4.0, 0)まで進む → X_1 = 4.0（主成分なので大きく積み上がる）</text>

  <!-- ===== Panel 2: k=2（信号に少しだけ含まれる物差し） ===== -->
  <text x="20" y="475" font-size="15" font-weight="bold" fill="#111827">k=2（信号に少しだけ含まれる物差し）</text>
  <text x="20" y="493" font-size="12" fill="#374151">同じ信号を、周波数2の物差し exp(-2πi・2・n/8) で測るとどうなるか</text>

  <line x1="75" y1="589" x2="375" y2="589" stroke="#9ca3af" stroke-width="1"/>
  <line x1="150" y1="514" x2="150" y2="694" stroke="#9ca3af" stroke-width="1"/>
  <text x="380" y="593" font-size="11" fill="#6b7280">Re</text>
  <text x="153" y="519" font-size="11" fill="#6b7280">Im</text>
  <text x="150" y="609" font-size="10" fill="#9ca3af" text-anchor="middle">0</text>
  <text x="200" y="609" font-size="10" fill="#9ca3af" text-anchor="middle">1</text>

  <!-- path (8 segments) -->
  <line x1="150" y1="589.0" x2="211.0" y2="589.0" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowGray)"/>
  <line x1="215" y1="589.0" x2="215.0" y2="620.4" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowGray)"/>
  <line x1="215" y1="624.4" x2="226.0" y2="624.4" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowGray)"/>
  <line x1="230" y1="624.4" x2="230.0" y2="655.7" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowGray)"/>
  <line x1="230" y1="659.7" x2="199.0" y2="659.7" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowGray)"/>
  <line x1="195" y1="659.7" x2="195.0" y2="628.4" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowGray)"/>
  <line x1="195" y1="624.4" x2="206.0" y2="624.4" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowGray)"/>
  <line x1="210" y1="624.4" x2="210.0" y2="593.0" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowGray)"/>

  <text x="150" y="577" font-size="11" fill="#374151" text-anchor="middle">出発点(原点)</text>
  <text x="182" y="603" font-size="11" fill="#6b7280" text-anchor="middle">n=0</text>

  <circle cx="210" cy="589" r="5" fill="#6b7280"/>
  <text x="218" y="579" font-size="13" font-weight="bold" fill="#6b7280">X_2 = 1.2</text>

  <text x="20" y="684" font-size="13" font-weight="bold" fill="#6b7280">→ 結論：8項の合計は(1.2, 0)までしか進まない → X_2 = 1.2（少し含まれる成分なので小さめ）</text>
  <text x="20" y="702" font-size="11" fill="#6b7280">（X_1=4.0 &gt; X_2=1.2 &gt; 0：「含まれる度合い」に応じて段階的な値になる。0になるとは限らない）</text>
</svg>
