<svg xmlns="http://www.w3.org/2000/svg" width="3400" height="3300" viewBox="0 0 680 660" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="680" height="660" fill="#ffffff"/>

  <text x="20" y="28" font-size="20" font-weight="bold" fill="#111827">画像の1行（横8ピクセル）に対するDFT適用例</text>

  <!-- ===== Section 1: k=1 相当の行 ===== -->
  <text x="20" y="76" font-size="15" font-weight="bold" fill="#111827">k=1相当の行：明暗が1回だけゆっくり変化</text>

  <!-- index labels n=0..7 -->
  <text x="55"  y="92" font-size="11" fill="#6b7280" text-anchor="middle">n=0</text>
  <text x="131" y="92" font-size="11" fill="#6b7280" text-anchor="middle">n=1</text>
  <text x="207" y="92" font-size="11" fill="#6b7280" text-anchor="middle">n=2</text>
  <text x="283" y="92" font-size="11" fill="#6b7280" text-anchor="middle">n=3</text>
  <text x="359" y="92" font-size="11" fill="#6b7280" text-anchor="middle">n=4</text>
  <text x="435" y="92" font-size="11" fill="#6b7280" text-anchor="middle">n=5</text>
  <text x="511" y="92" font-size="11" fill="#6b7280" text-anchor="middle">n=6</text>
  <text x="587" y="92" font-size="11" fill="#6b7280" text-anchor="middle">n=7</text>

  <!-- 8 pixels, grayscale fill = brightness value -->
  <rect x="20"  y="102" width="70" height="70" fill="#e4e4e4" stroke="#9ca3af"/>
  <rect x="96"  y="102" width="70" height="70" fill="#c7c7c7" stroke="#9ca3af"/>
  <rect x="172" y="102" width="70" height="70" fill="#808080" stroke="#9ca3af"/>
  <rect x="248" y="102" width="70" height="70" fill="#393939" stroke="#9ca3af"/>
  <rect x="324" y="102" width="70" height="70" fill="#1c1c1c" stroke="#9ca3af"/>
  <rect x="400" y="102" width="70" height="70" fill="#393939" stroke="#9ca3af"/>
  <rect x="476" y="102" width="70" height="70" fill="#808080" stroke="#9ca3af"/>
  <rect x="552" y="102" width="70" height="70" fill="#c7c7c7" stroke="#9ca3af"/>

  <!-- brightness value labels (丸めて表示) -->
  <text x="55"  y="188" font-size="12" fill="#374151" text-anchor="middle">228</text>
  <text x="131" y="188" font-size="12" fill="#374151" text-anchor="middle">198.7</text>
  <text x="207" y="188" font-size="12" fill="#374151" text-anchor="middle">128</text>
  <text x="283" y="188" font-size="12" fill="#374151" text-anchor="middle">57.3</text>
  <text x="359" y="188" font-size="12" fill="#374151" text-anchor="middle">28</text>
  <text x="435" y="188" font-size="12" fill="#374151" text-anchor="middle">57.3</text>
  <text x="511" y="188" font-size="12" fill="#374151" text-anchor="middle">128</text>
  <text x="587" y="188" font-size="12" fill="#374151" text-anchor="middle">198.7</text>

  <text x="20" y="212" font-size="13" fill="#374151">周波数ごとの振幅 |X_k|（k=1〜7。直流成分 k=0=1024 は割愛）</text>

  <!-- bar chart baseline -->
  <line x1="14" y1="302" x2="628" y2="302" stroke="#9ca3af" stroke-width="1"/>

  <!-- bars: k=1..7, values [400,0,0,0,0,0,400] -->
  <rect x="33"  y="232" width="50" height="70" fill="#2563eb"/>
  <rect x="109" y="299" width="50" height="3"  fill="#d1d5db"/>
  <rect x="185" y="299" width="50" height="3"  fill="#d1d5db"/>
  <rect x="261" y="299" width="50" height="3"  fill="#d1d5db"/>
  <rect x="337" y="299" width="50" height="3"  fill="#d1d5db"/>
  <rect x="413" y="299" width="50" height="3"  fill="#d1d5db"/>
  <rect x="489" y="232" width="50" height="70" fill="#2563eb"/>

  <!-- bar value labels -->
  <text x="58"  y="226" font-size="11" fill="#2563eb" text-anchor="middle" font-weight="bold">400</text>
  <text x="134" y="293" font-size="11" fill="#9ca3af" text-anchor="middle">0</text>
  <text x="210" y="293" font-size="11" fill="#9ca3af" text-anchor="middle">0</text>
  <text x="286" y="293" font-size="11" fill="#9ca3af" text-anchor="middle">0</text>
  <text x="362" y="293" font-size="11" fill="#9ca3af" text-anchor="middle">0</text>
  <text x="438" y="293" font-size="11" fill="#9ca3af" text-anchor="middle">0</text>
  <text x="514" y="226" font-size="11" fill="#2563eb" text-anchor="middle" font-weight="bold">400</text>

  <!-- k labels -->
  <text x="58"  y="318" font-size="12" fill="#374151" text-anchor="middle">k=1</text>
  <text x="134" y="318" font-size="12" fill="#374151" text-anchor="middle">k=2</text>
  <text x="210" y="318" font-size="12" fill="#374151" text-anchor="middle">k=3</text>
  <text x="286" y="318" font-size="12" fill="#374151" text-anchor="middle">k=4</text>
  <text x="362" y="318" font-size="12" fill="#374151" text-anchor="middle">k=5</text>
  <text x="438" y="318" font-size="12" fill="#374151" text-anchor="middle">k=6</text>
  <text x="514" y="318" font-size="12" fill="#374151" text-anchor="middle">k=7</text>

  <!-- ===== Section 2: k=3 相当の行 ===== -->
  <text x="20" y="376" font-size="15" font-weight="bold" fill="#111827">k=3相当の行：明暗が3回すばやく変化</text>

  <text x="55"  y="392" font-size="11" fill="#6b7280" text-anchor="middle">n=0</text>
  <text x="131" y="392" font-size="11" fill="#6b7280" text-anchor="middle">n=1</text>
  <text x="207" y="392" font-size="11" fill="#6b7280" text-anchor="middle">n=2</text>
  <text x="283" y="392" font-size="11" fill="#6b7280" text-anchor="middle">n=3</text>
  <text x="359" y="392" font-size="11" fill="#6b7280" text-anchor="middle">n=4</text>
  <text x="435" y="392" font-size="11" fill="#6b7280" text-anchor="middle">n=5</text>
  <text x="511" y="392" font-size="11" fill="#6b7280" text-anchor="middle">n=6</text>
  <text x="587" y="392" font-size="11" fill="#6b7280" text-anchor="middle">n=7</text>

  <rect x="20"  y="402" width="70" height="70" fill="#e4e4e4" stroke="#9ca3af"/>
  <rect x="96"  y="402" width="70" height="70" fill="#393939" stroke="#9ca3af"/>
  <rect x="172" y="402" width="70" height="70" fill="#808080" stroke="#9ca3af"/>
  <rect x="248" y="402" width="70" height="70" fill="#c7c7c7" stroke="#9ca3af"/>
  <rect x="324" y="402" width="70" height="70" fill="#1c1c1c" stroke="#9ca3af"/>
  <rect x="400" y="402" width="70" height="70" fill="#c7c7c7" stroke="#9ca3af"/>
  <rect x="476" y="402" width="70" height="70" fill="#808080" stroke="#9ca3af"/>
  <rect x="552" y="402" width="70" height="70" fill="#393939" stroke="#9ca3af"/>

  <text x="55"  y="488" font-size="12" fill="#374151" text-anchor="middle">228</text>
  <text x="131" y="488" font-size="12" fill="#374151" text-anchor="middle">57.3</text>
  <text x="207" y="488" font-size="12" fill="#374151" text-anchor="middle">128</text>
  <text x="283" y="488" font-size="12" fill="#374151" text-anchor="middle">198.7</text>
  <text x="359" y="488" font-size="12" fill="#374151" text-anchor="middle">28</text>
  <text x="435" y="488" font-size="12" fill="#374151" text-anchor="middle">198.7</text>
  <text x="511" y="488" font-size="12" fill="#374151" text-anchor="middle">128</text>
  <text x="587" y="488" font-size="12" fill="#374151" text-anchor="middle">57.3</text>

  <text x="20" y="512" font-size="13" fill="#374151">周波数ごとの振幅 |X_k|（k=1〜7。直流成分 k=0=1024 は割愛）</text>

  <line x1="14" y1="602" x2="628" y2="602" stroke="#9ca3af" stroke-width="1"/>

  <!-- bars: k=1..7, values [0,0,400,0,400,0,0] -->
  <rect x="33"  y="599" width="50" height="3"  fill="#d1d5db"/>
  <rect x="109" y="599" width="50" height="3"  fill="#d1d5db"/>
  <rect x="185" y="532" width="50" height="70" fill="#2563eb"/>
  <rect x="261" y="599" width="50" height="3"  fill="#d1d5db"/>
  <rect x="337" y="532" width="50" height="70" fill="#2563eb"/>
  <rect x="413" y="599" width="50" height="3"  fill="#d1d5db"/>
  <rect x="489" y="599" width="50" height="3"  fill="#d1d5db"/>

  <text x="58"  y="593" font-size="11" fill="#9ca3af" text-anchor="middle">0</text>
  <text x="134" y="593" font-size="11" fill="#9ca3af" text-anchor="middle">0</text>
  <text x="210" y="526" font-size="11" fill="#2563eb" text-anchor="middle" font-weight="bold">400</text>
  <text x="286" y="593" font-size="11" fill="#9ca3af" text-anchor="middle">0</text>
  <text x="362" y="526" font-size="11" fill="#2563eb" text-anchor="middle" font-weight="bold">400</text>
  <text x="438" y="593" font-size="11" fill="#9ca3af" text-anchor="middle">0</text>
  <text x="514" y="593" font-size="11" fill="#9ca3af" text-anchor="middle">0</text>

  <text x="58"  y="618" font-size="12" fill="#374151" text-anchor="middle">k=1</text>
  <text x="134" y="618" font-size="12" fill="#374151" text-anchor="middle">k=2</text>
  <text x="210" y="618" font-size="12" fill="#374151" text-anchor="middle">k=3</text>
  <text x="286" y="618" font-size="12" fill="#374151" text-anchor="middle">k=4</text>
  <text x="362" y="618" font-size="12" fill="#374151" text-anchor="middle">k=5</text>
  <text x="438" y="618" font-size="12" fill="#374151" text-anchor="middle">k=6</text>
  <text x="514" y="618" font-size="12" fill="#374151" text-anchor="middle">k=7</text>
</svg>
