    <g stroke="#c3cad4" stroke-width="1" fill="none" opacity="0.9">
      <line x1="0" y1="-0" x2="216.25" y2="41.76" />
      <line x1="0" y1="-0" x2="0" y2="-242.52" />
      <line x1="0" y1="-0" x2="-135.13" y2="66.83" />
      <line x1="216.25" y1="41.76" x2="216.25" y2="-200.76" />
      <line x1="216.25" y1="41.76" x2="81.12" y2="108.58" />
      <line x1="0" y1="-242.52" x2="216.25" y2="-200.76" />
      <line x1="0" y1="-242.52" x2="-135.13" y2="-175.69" />
      <line x1="-135.13" y1="66.83" x2="81.12" y2="108.58" />
      <line x1="-135.13" y1="66.83" x2="-135.13" y2="-175.69" />
      <line x1="216.25" y1="-200.76" x2="81.12" y2="-133.94" />
      <line x1="81.12" y1="108.58" x2="81.12" y2="-133.94" />
      <line x1="-135.13" y1="-175.69" x2="81.12" y2="-133.94" />
    </g>

    <g stroke-width="2" fill="none">
      <line x1="0" y1="0" x2="216.25" y2="41.76" stroke="#d1483f" />
