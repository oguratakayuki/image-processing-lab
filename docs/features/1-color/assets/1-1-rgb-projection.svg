  <text x="235" y="592" font-size="12.5" fill="#8990a0" text-anchor="middle">RGB立方体（各辺0〜255）。点線はw方向の軸へ下ろした垂線</text>

  <!-- 右パネル: 1次元スケール -->
  <svg x="500" y="110" width="360" height="340" viewBox="0 0 320 300">
    <defs>
      <linearGradient id="grayramp" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#000000" />
        <stop offset="100%" stop-color="#ffffff" />
      </linearGradient>
    </defs>

    <rect x="24" y="14" width="26" height="256" fill="url(#grayramp)" stroke="#c3cad4" stroke-width="1" rx="3" />
    <line x1="50" y1="14" x2="58" y2="14" stroke="#8990a0" />
    <line x1="50" y1="270" x2="58" y2="270" stroke="#8990a0" />
    <text x="62" y="18" font-size="11" fill="#8990a0">0</text>
    <text x="62" y="274" font-size="11" fill="#8990a0">255</text>

    <g font-size="11.5">
      <g>
        <line x1="50" y1="14.00" x2="118" y2="14" stroke="#8990a0" stroke-dasharray="2 2" />
        <circle cx="37" cy="14.00" r="5" fill="#1a1a1a" stroke="#171a20" stroke-width="1.3" />
        <text x="122" y="18" fill="#171a20">0　black</text>
      </g>
      <g>
        <line x1="50" y1="43.11" x2="118" y2="43.11" stroke="#8990a0" stroke-dasharray="2 2" />
        <circle cx="37" cy="43.11" r="5" fill="rgb(0,0,255)" stroke="#171a20" stroke-width="1.3" />
        <text x="122" y="47.11" fill="#171a20">29　blue</text>
      </g>
      <g>
        <line x1="50" y1="90.30" x2="118" y2="90.30" stroke="#8990a0" stroke-dasharray="2 2" />
        <circle cx="37" cy="90.30" r="5" fill="rgb(255,0,0)" stroke="#171a20" stroke-width="1.3" />
        <text x="122" y="94.30" fill="#171a20">76　red</text>
      </g>
      <g>
        <line x1="50" y1="142.50" x2="118" y2="131" stroke="#8990a0" stroke-dasharray="2 2" />
        <circle cx="37" cy="142.50" r="5" fill="rgb(128,128,128)" stroke="#171a20" stroke-width="1.3" />
        <text x="122" y="134.5" fill="#171a20">128　gray128</text>
      </g>
      <g>
        <line x1="50" y1="155.55" x2="118" y2="153" stroke="#8990a0" stroke-dasharray="2 2" />
        <circle cx="37" cy="155.55" r="5" fill="rgb(100,150,200)" stroke="#171a20" stroke-width="1.3" />
        <text x="122" y="156.5" fill="#171a20">141　mid(100,150,200)</text>
      </g>
      <g>
        <line x1="50" y1="164.59" x2="118" y2="176" stroke="#8990a0" stroke-dasharray="2 2" />
        <circle cx="37" cy="164.59" r="5" fill="rgb(0,255,0)" stroke="#171a20" stroke-width="1.3" />
        <text x="122" y="179" fill="#171a20">150　green</text>
      </g>
      <g>
        <line x1="50" y1="270" x2="118" y2="270" stroke="#8990a0" stroke-dasharray="2 2" />
        <circle cx="37" cy="270" r="5" fill="#ffffff" stroke="#171a20" stroke-width="1.3" />
        <text x="122" y="274" fill="#171a20">255　white</text>
      </g>
