  <text x="680" y="592" font-size="12.5" fill="#8990a0" text-anchor="middle">出力は常にこの1本の軸(0〜255)上の1点になる</text>

  <text x="24" y="624" font-size="12" fill="#8990a0">実装: engine/src/imglab_engine/color/grayscale.py — to_grayscale()</text>
</svg>
