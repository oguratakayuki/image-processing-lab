    <g stroke-width="1" stroke-dasharray="3 3" opacity="0.8">
      <line x1="81.12" y1="-133.94" x2="110.2" y2="-273.52" stroke="#8990a0" />
      <line x1="216.25" y1="41.76" x2="32.95" y2="-81.78" stroke="#8990a0" />
      <line x1="0" y1="-242.52" x2="64.69" y2="-160.56" stroke="#8990a0" />
      <line x1="-135.13" y1="66.83" x2="12.56" y2="-31.18" stroke="#8990a0" />
      <line x1="-21.18" y1="-73.87" x2="60.82" y2="-150.97" stroke="#8990a0" />
      <line x1="40.72" y1="-67.23" x2="55.31" y2="-137.3" stroke="#8990a0" />
    </g>

    <g fill="#30363f">
      <circle cx="110.2" cy="-273.52" r="2.4" />
      <circle cx="32.95" cy="-81.78" r="2.4" />
      <circle cx="64.69" cy="-160.56" r="2.4" />
      <circle cx="12.56" cy="-31.18" r="2.4" />
      <circle cx="60.82" cy="-150.97" r="2.4" />
      <circle cx="55.31" cy="-137.3" r="2.4" />
    </g>

    <g stroke="#171a20" stroke-width="1.5">
      <circle cx="0" cy="-0" r="5.5" fill="#1a1a1a" />
      <circle cx="81.12" cy="-133.94" r="5.5" fill="#ffffff" />
      <circle cx="216.25" cy="41.76" r="5.5" fill="rgb(255,0,0)" />
      <circle cx="0" cy="-242.52" r="5.5" fill="rgb(0,255,0)" />
      <circle cx="-135.13" cy="66.83" r="5.5" fill="rgb(0,0,255)" />
      <circle cx="-21.18" cy="-73.87" r="5.5" fill="rgb(100,150,200)" />
      <circle cx="40.72" cy="-67.23" r="5.5" fill="rgb(128,128,128)" />
