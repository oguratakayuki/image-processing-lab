<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 640" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace">
  <rect x="0" y="0" width="920" height="640" fill="#ffffff" />

  <text x="24" y="34" font-size="18" font-weight="700" fill="#171a20">RGB (3次元ベクトル) → Grayscale (1次元) への射影</text>
  <text x="24" y="58" font-size="13.5" fill="#5b6472">Gray = 0.299・R + 0.587・G + 0.114・B　— 重みベクトル w = (0.299, 0.587, 0.114) との内積</text>

  <!-- 左パネル: RGB立方体 -->
